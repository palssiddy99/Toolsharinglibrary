<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToolShare — Campus Asset Lending & Management System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for live JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-amber-400 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Icons ---
    const IconWrench = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>;
    const IconLayers = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>;
    const IconHistory = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
    const IconPlus = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>;
    const IconChart = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>;
    const IconInventory = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>;
    const IconSearch = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>;
    const IconRotate = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>;
    const IconClose = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>;
    const IconUser = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>;
    const IconShield = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>;
    const IconLogOut = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>;

    // --- Seed Demo Users ---
    const DEMO_USERS = [
      { id: 'u-1', name: 'Aarav Patel', rollNo: 'SE-2026-081', email: 'aarav@campus.edu', role: 'Student Borrower', dept: 'Mechanical Engineering', semester: 'Semester 4' },
      { id: 'u-2', name: 'Dr. K. Sharma', rollNo: 'FAC-MECH-09', email: 'sharma.k@campus.edu', role: 'Faculty Custodian', dept: 'Manufacturing & Workshop', semester: 'Faculty Staff' },
      { id: 'u-3', name: 'Sneha Roy', rollNo: 'CS-2026-044', email: 'sneha@campus.edu', role: 'Club Lead', dept: 'Robotics & Automation Society', semester: 'Semester 6' }
    ];

    // --- Seed Tools Database ---
    const SEED_TOOLS = [
      {
        id: 't-101',
        name: 'Bosch Professional 18V Cordless Drill',
        category: 'Power Tools',
        deposit: 750,
        condition: 'Excellent',
        owner: 'Mechanical Lab A (Prof. Sharma)',
        status: 'Available',
        image: 'https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=600&q=80',
        description: 'Includes dual 2.0Ah Li-ion batteries, rapid charger, and 30-piece titanium bit set.'
      },
      {
        id: 't-102',
        name: '46-Piece Precision Ratchet Socket Set',
        category: 'Hand Tools',
        deposit: 400,
        condition: 'Good',
        owner: 'Robotics Club (Sneha R.)',
        status: 'Available',
        image: 'https://images.unsplash.com/photo-1581783342308-f792dbdd27c5?auto=format&fit=crop&w=600&q=80',
        description: '1/4 inch drive chrome vanadium steel set for chassis, engines, and frame mounts.'
      },
      {
        id: 't-103',
        name: 'Electric Hedge Trimmer 550W',
        category: 'Gardening',
        deposit: 600,
        condition: 'Like New',
        owner: 'Campus Estate Maintenance',
        status: 'Borrowed',
        image: 'https://images.unsplash.com/photo-1592417817098-8f3d6ef231f8?auto=format&fit=crop&w=600&q=80',
        description: 'Dual-action 450mm blades with safety two-hand power trigger.'
      },
      {
        id: 't-104',
        name: 'Digital Laser Rangefinder 40M',
        category: 'Measurement',
        deposit: 300,
        condition: 'Good',
        owner: 'Civil Surveying Lab',
        status: 'Available',
        image: 'https://images.unsplash.com/photo-1572981779307-38b8cabb2407?auto=format&fit=crop&w=600&q=80',
        description: 'High precision millimeter measurement with auto area and volume calculator.'
      }
    ];

    // --- Local DB Engine ---
    const localDb = {
      getTools: () => {
        const raw = localStorage.getItem('toolshare_db_tools');
        if (!raw) {
          localStorage.setItem('toolshare_db_tools', JSON.stringify(SEED_TOOLS));
          return SEED_TOOLS;
        }
        return JSON.parse(raw);
      },
      getBorrows: () => {
        const raw = localStorage.getItem('toolshare_db_borrows');
        return raw ? JSON.parse(raw) : [];
      },
      getCurrentUser: () => {
        const raw = localStorage.getItem('toolshare_db_user');
        return raw ? JSON.parse(raw) : DEMO_USERS[0];
      },
      setCurrentUser: (user) => {
        localStorage.setItem('toolshare_db_user', JSON.stringify(user));
      },
      borrowTool: (toolId, borrowDetails) => {
        const tools = localDb.getTools();
        const tool = tools.find(t => t.id === toolId);
        if (!tool) return null;

        tool.status = 'Borrowed';
        localStorage.setItem('toolshare_db_tools', JSON.stringify(tools));

        const dueDate = new Date();
        dueDate.setDate(dueDate.getDate() + parseInt(borrowDetails.days || 3));

        const newBorrow = {
          id: 'b-' + Date.now(),
          toolId,
          toolName: tool.name,
          category: tool.category,
          borrower: borrowDetails.borrowerName,
          rollNo: borrowDetails.rollNo,
          dept: borrowDetails.dept,
          purpose: borrowDetails.purpose,
          pickupPoint: borrowDetails.pickupPoint,
          timeSlot: borrowDetails.timeSlot,
          borrowDate: new Date().toLocaleDateString(),
          dueDate: dueDate.toLocaleDateString(),
          cautionDeposit: borrowDetails.calculatedDeposit,
          safetyApproved: borrowDetails.safetyAccepted,
          status: 'Active'
        };

        const borrows = [newBorrow, ...localDb.getBorrows()];
        localStorage.setItem('toolshare_db_borrows', JSON.stringify(borrows));
        return { tools, borrows };
      },
      returnTool: (borrowId) => {
        const borrows = localDb.getBorrows();
        const borrow = borrows.find(b => b.id === borrowId);
        if (!borrow) return null;

        borrow.status = 'Returned';
        borrow.returnedDate = new Date().toLocaleDateString();
        localStorage.setItem('toolshare_db_borrows', JSON.stringify(borrows));

        const tools = localDb.getTools();
        const tool = tools.find(t => t.id === borrow.toolId);
        if (tool) {
          tool.status = 'Available';
          localStorage.setItem('toolshare_db_tools', JSON.stringify(tools));
        }
        return { tools, borrows };
      },
      saveTool: (tool) => {
        const tools = [{ ...tool, id: 't-' + Date.now(), status: 'Available' }, ...localDb.getTools()];
        localStorage.setItem('toolshare_db_tools', JSON.stringify(tools));
        return tools;
      },
      deleteTool: (id) => {
        const tools = localDb.getTools().filter(t => t.id !== id);
        localStorage.setItem('toolshare_db_tools', JSON.stringify(tools));
        return tools;
      },
      reset: () => {
        localStorage.setItem('toolshare_db_tools', JSON.stringify(SEED_TOOLS));
        localStorage.removeItem('toolshare_db_borrows');
        localStorage.setItem('toolshare_db_user', JSON.stringify(DEMO_USERS[0]));
        return { tools: SEED_TOOLS, borrows: [], user: DEMO_USERS[0] };
      }
    };

    function App() {
      const [tab, setTab] = useState('catalog');
      const [currentUser, setCurrentUser] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup'

      const [tools, setTools] = useState([]);
      const [borrows, setBorrows] = useState([]);
      const [search, setSearch] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [selectedTool, setSelectedTool] = useState(null);

      // Auth form state
      const [authForm, setAuthForm] = useState({
        name: '',
        email: '',
        rollNo: '',
        dept: 'Mechanical Engineering',
        role: 'Student Borrower'
      });

      // Rich Checkout & Borrow Options State
      const [borrowForm, setBorrowForm] = useState({
        borrowerName: '',
        rollNo: '',
        dept: 'Mechanical Engineering',
        purpose: 'Course Capstone Project',
        pickupPoint: 'Central Workshop Counter A',
        timeSlot: 'Morning (09:00 - 12:00)',
        days: 3,
        safetyAccepted: true
      });

      // Post tool state
      const [newTool, setNewTool] = useState({
        name: '',
        category: 'Power Tools',
        deposit: 500,
        condition: 'Good',
        owner: '',
        description: '',
        image: ''
      });
      const [imageMode, setImageMode] = useState('file');

      useEffect(() => {
        const u = localDb.getCurrentUser();
        setCurrentUser(u);
        setTools(localDb.getTools());
        setBorrows(localDb.getBorrows());
      }, []);

      // Auto-populate borrow form with current authenticated user
      useEffect(() => {
        if (currentUser) {
          setBorrowForm(prev => ({
            ...prev,
            borrowerName: currentUser.name,
            rollNo: currentUser.rollNo,
            dept: currentUser.dept
          }));
          setNewTool(prev => ({
            ...prev,
            owner: `${currentUser.name} (${currentUser.rollNo})`
          }));
        }
      }, [currentUser]);

      const activeBorrows = borrows.filter(b => b.status === 'Active');
      const availableTools = tools.filter(t => t.status === 'Available');

      const handleImageFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 2 * 1024 * 1024) {
            alert('File exceeds 2MB limit. Please upload a smaller photo.');
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            setNewTool(prev => ({ ...prev, image: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleConfirmBorrow = (e) => {
        e.preventDefault();
        if (!selectedTool) return;

        const calculatedDeposit = Number(selectedTool.deposit) + (borrowForm.days > 5 ? 150 : 0);

        const res = localDb.borrowTool(selectedTool.id, {
          ...borrowForm,
          calculatedDeposit
        });

        if (res) {
          setTools(res.tools);
          setBorrows(res.borrows);
          setSelectedTool(null);
          setTab('borrows');
        }
      };

      const handleReturn = (borrowId) => {
        const res = localDb.returnTool(borrowId);
        if (res) {
          setTools(res.tools);
          setBorrows(res.borrows);
        }
      };

      const handleCreateTool = (e) => {
        e.preventDefault();
        if (!newTool.name || !newTool.owner) return;
        const updated = localDb.saveTool({
          ...newTool,
          image: newTool.image || 'https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=600&q=80'
        });
        setTools(updated);
        setTab('catalog');
      };

      const handleQuickSwitchUser = (user) => {
        localDb.setCurrentUser(user);
        setCurrentUser(user);
        setShowAuthModal(false);
      };

      const handleManualAuth = (e) => {
        e.preventDefault();
        const userObj = {
          id: 'u-' + Date.now(),
          name: authForm.name || 'Campus Student',
          email: authForm.email || 'student@campus.edu',
          rollNo: authForm.rollNo || 'SE-2026-X',
          dept: authForm.dept,
          role: authForm.role,
          semester: 'Enrolled'
        };
        localDb.setCurrentUser(userObj);
        setCurrentUser(userObj);
        setShowAuthModal(false);
      };

      const filteredTools = tools.filter(t => {
        const mQuery = t.name.toLowerCase().includes(search.toLowerCase()) || 
                       t.description.toLowerCase().includes(search.toLowerCase()) ||
                       t.owner.toLowerCase().includes(search.toLowerCase());
        const mCat = categoryFilter === 'All' || t.category === categoryFilter;
        return mQuery && mCat;
      });

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
          
          {/* Top Global Header */}
          <header className="sticky top-0 z-40 bg-slate-900 border-b border-slate-800 text-white shadow-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
              
              {/* Brand Logo */}
              <div onClick={() => setTab('catalog')} className="flex items-center gap-3 cursor-pointer group">
                <div className="w-10 h-10 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-black group-hover:scale-105 transition-transform shadow-lg shadow-amber-500/20">
                  <IconWrench />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold tracking-tight text-lg text-white">ToolShare</span>
                    <span className="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
                      v3.0 Portal
                    </span>
                  </div>
                  <p className="text-[10px] text-slate-400">Campus Asset Lending & Auth System</p>
                </div>
              </div>

              {/* Main Nav Tabs */}
              <nav className="flex items-center gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800 overflow-x-auto">
                <button
                  onClick={() => setTab('catalog')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                    tab === 'catalog' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                  }`}
                >
                  <IconLayers />
                  <span className="hidden sm:inline">Catalog</span>
                  <span className="bg-slate-900/60 text-[10px] px-1.5 py-0.2 rounded-full font-mono">{tools.length}</span>
                </button>

                <button
                  onClick={() => setTab('borrows')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition relative ${
                    tab === 'borrows' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                  }`}
                >
                  <IconHistory />
                  <span>Loans</span>
                  {activeBorrows.length > 0 && (
                    <span className="bg-red-500 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold animate-pulse">
                      {activeBorrows.length}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setTab('dashboard')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                    tab === 'dashboard' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                  }`}
                >
                  <IconChart />
                  <span>Analytics</span>
                </button>

                <button
                  onClick={() => setTab('inventory')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                    tab === 'inventory' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                  }`}
                >
                  <IconInventory />
                  <span>Inventory</span>
                </button>

                <button
                  onClick={() => setTab('list')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                    tab === 'list' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                  }`}
                >
                  <IconPlus />
                  <span>Post Tool</span>
                </button>
              </nav>

              {/* User Login / Profile Badge */}
              <div className="flex items-center gap-2">
                {currentUser ? (
                  <button
                    onClick={() => setShowAuthModal(true)}
                    className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700/80 border border-slate-700 transition"
                  >
                    <div className="w-6 h-6 rounded-full bg-amber-500 text-slate-950 font-bold flex items-center justify-center text-[10px]">
                      {currentUser.name[0]}
                    </div>
                    <div className="text-left hidden md:block">
                      <div className="text-xs font-bold text-slate-200 line-clamp-1">{currentUser.name}</div>
                      <div className="text-[9px] text-amber-400 font-mono">{currentUser.rollNo}</div>
                    </div>
                  </button>
                ) : (
                  <button
                    onClick={() => setShowAuthModal(true)}
                    className="px-3.5 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold transition shadow"
                  >
                    Login / ID
                  </button>
                )}

                <button
                  onClick={() => {
                    if (confirm('Reset to standard initial seed data?')) {
                      const r = localDb.reset();
                      setTools(r.tools);
                      setBorrows(r.borrows);
                      setCurrentUser(r.user);
                    }
                  }}
                  className="text-[11px] text-slate-400 hover:text-slate-200 border border-slate-800 px-2 py-1.5 rounded-lg hover:bg-slate-800 hidden lg:block"
                >
                  Reset DB
                </button>
              </div>
            </div>
          </header>

          {/* Subheader: Active User Context Strip */}
          <div className="bg-slate-950 text-slate-400 text-xs px-4 py-2 border-b border-slate-800">
            <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>Active Profile: <strong className="text-slate-200">{currentUser?.name}</strong> ({currentUser?.role})</span>
                <span className="text-slate-600">•</span>
                <span className="hidden sm:inline">{currentUser?.dept}</span>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowAuthModal(true)}
                  className="text-amber-400 hover:underline text-[11px]"
                >
                  Switch Role / Re-authenticate
                </button>
              </div>
            </div>
          </div>

          {/* View Container */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">

            {/* TAB 1: CATALOG */}
            {tab === 'catalog' && (
              <div className="space-y-6">
                {/* Search & Filter Bar */}
                <div className="bg-white p-3 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col lg:flex-row gap-3 items-center justify-between">
                  <div className="relative w-full lg:w-96">
                    <span className="absolute left-3.5 top-3 text-slate-400"><IconSearch /></span>
                    <input
                      type="text"
                      placeholder="Search drills, wrenches, survey kits, or lab custodian..."
                      value={search}
                      onChange={(e) => setSearch(e.target.value)}
                      className="w-full pl-10 pr-4 py-2 bg-slate-50 hover:bg-slate-100/70 focus:bg-white rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 focus:outline-none transition"
                    />
                  </div>

                  <div className="flex gap-1.5 overflow-x-auto w-full lg:w-auto pb-1 lg:pb-0">
                    {['All', 'Power Tools', 'Hand Tools', 'Gardening', 'Measurement'].map(cat => (
                      <button
                        key={cat}
                        onClick={() => setCategoryFilter(cat)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition ${
                          categoryFilter === cat ? 'bg-slate-950 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        {cat}
                      </button>

                    <button
                      type="submit"
                      className="px-5 py-2 bg-slate-950 hover:bg-amber-500 hover:text-slate-950 text-white rounded-xl font-bold transition shadow-md"
                    >
                      Authorize & Issue Loan
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* AUTH & PROFILE SWITCHER MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 relative">
                <button
                  onClick={() => setShowAuthModal(false)}
                  className="absolute right-4 top-4 text-slate-400 hover:text-slate-700 p-1 rounded-lg"
                >
                  <IconClose />
                </button>

                <h3 className="font-extrabold text-slate-900 text-lg">Identity & Access Control</h3>
                <p className="text-xs text-slate-500 mb-4">Switch mock student personas or sign in with university credentials</p>

                {/* 1-Click Quick Personas for Evaluation */}
                <div className="space-y-2 mb-6">
                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block">1-Click Quick Demo Profiles</span>
                  {DEMO_USERS.map(user => (
                    <button
                      key={user.id}
                      onClick={() => handleQuickSwitchUser(user)}
                      className={`w-full p-3 rounded-xl border text-left flex items-center justify-between transition ${
                        currentUser?.id === user.id ? 'border-amber-500 bg-amber-50/50' : 'border-slate-200 hover:bg-slate-50'
                      }`}
                    >
                      <div>
                        <div className="text-xs font-bold text-slate-900">{user.name}</div>
                        <div className="text-[10px] text-slate-500">{user.role} • {user.dept}</div>
                      </div>
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-white border border-slate-200 font-bold">
                        {user.rollNo}
                      </span>
                    </button>
                  ))}
                </div>

                <div className="border-t border-slate-200 pt-4">
                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-3">Custom Login Form</span>
                  <form onSubmit={handleManualAuth} className="space-y-3 text-xs">
                    <div>
                      <input
                        type="text"
                        placeholder="Full Name"
                        value={authForm.name}
                        onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl border border-slate-200"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <input
                        type="text"
                        placeholder="Student ID / Roll No."
                        value={authForm.rollNo}
                        onChange={(e) => setAuthForm({ ...authForm, rollNo: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 font-mono"
                      />
                      <select
                        value={authForm.role}
                        onChange={(e) => setAuthForm({ ...authForm, role: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 bg-white"
                      >
                        <option>Student Borrower</option>
                        <option>Faculty Custodian</option>
                        <option>Club Lead</option>
                      </select>
                    </div>
                    <button
                      type="submit"
                      className="w-full py-2 bg-slate-950 hover:bg-amber-500 hover:text-slate-950 text-white font-bold rounded-xl transition"
                    >
                      Log In with ID
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-400">
            ToolShare Enterprise Portal • Field Project Demonstration • GitHub Pages Ready
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
